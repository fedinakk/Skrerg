<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skrerg Timings</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <header class="toolbar">
        <div class="title">
            <span class="dot"></span>
            <span>Тайминги фрагментов</span>
        </div>
        <div class="actions">
            <label class="auto">
                <input type="checkbox" id="autoRefresh" />
                <span>Авто</span>
            </label>
            <button id="refreshBtn" title="Обновить">Обновить</button>
        </div>
    </header>

    <div id="status" class="status"></div>

    <main id="list" class="list"></main>

    <section class="footer">
        <button id="copyBtn" class="primary" disabled>Скопировать тайминги</button>
        <div id="copyHint" class="copy-hint"></div>
    </section>

    <section class="markers">
        <div class="markers-title">Расставить маркеры на таймлайне</div>
        <textarea id="markerInput" class="marker-input"
            placeholder="00:00:42:12 - 00:01:08:17 + 00:04:53:14 - 00:05:21:19"></textarea>
        <label class="opt razor-opt">
            <input type="checkbox" id="withRazor" />
            <span>С разрезом (надрез на всех дорожках)</span>
        </label>
        <button id="markerBtn" class="secondary">Расставить маркеры</button>
        <div id="markerHint" class="copy-hint"></div>
    </section>

    <section class="markers">
        <div class="markers-title">Пересборка фрагментов в конец дорожки</div>
        <textarea id="asmInput" class="marker-input asm-input"
            placeholder="1. 00:01:25:12 - 00:01:52:12 + 00:01:54:12 - 00:02:40:04&#10;2. 00:04:09:01 - 00:04:17:05 + 00:04:57:13 - 00:05:13:11&#10;3. ..."></textarea>
        <div class="asm-row">
            <label class="asm-field">
                <span>Старт</span>
                <input type="text" id="asmStart" value="00:30:00:00" />
            </label>
            <label class="asm-field">
                <span>Пауза, с</span>
                <input type="number" id="asmGap" value="10" min="0" step="1" />
            </label>
            <label class="opt asm-audio">
                <input type="checkbox" id="asmAudio" checked />
                <span>Со звуком</span>
            </label>
        </div>
        <button id="asmBtn" class="secondary">Собрать в конце дорожки</button>
        <div id="asmHint" class="copy-hint"></div>
    </section>

    <script src="js/CSInterface.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
